[project]
name = "backend"
version = "0.1.0"
description = "Planner FastAPI backend service"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.128.1",
    "supabase>=2.0.0",
    "PyJWT[crypto]>=2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=1.0.0"]
