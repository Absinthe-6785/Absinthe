name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel superseded runs on the same branch/PR to avoid wasted queue time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A feature Push may skip only when an exact open main PR covers its SHA.
  push-pr-gate:
    name: CI event gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip-duplicate-push: ${{ steps.decide.outputs.skip-duplicate-push }}
    steps:
      - name: Keep CI unless an exact open main PR covers this push
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          skip_duplicate_push=0

          if [[ "$EVENT_NAME" == "push" && "$REF" != "refs/heads/main" && "$REPOSITORY" == "Absinthe-6785/Absinthe" ]]; then
            if pull_requests="$(gh api "repos/$REPOSITORY/commits/$SHA/pulls?per_page=100" 2>/dev/null)"; then
              if printf '%s' "$pull_requests" | jq -e \
                --arg repository "$REPOSITORY" \
                --arg sha "$SHA" \
                'any(.[]; .state == "open" and .base.repo.full_name == $repository and .base.ref == "main" and .head.sha == $sha and .head.repo.full_name == $repository)' \
                >/dev/null; then
                skip_duplicate_push=1
                echo "::notice::Exact open main PR matched; required validation remains on the PR run."
              fi
            else
              echo "::warning::Could not verify an equivalent open PR; running full Push CI."
            fi
          fi

          echo "skip-duplicate-push=$skip_duplicate_push" >> "$GITHUB_OUTPUT"

  # Keep protected contexts on PR/main runs; feature Push contexts are distinct and cannot mask PR checks.
  typecheck:
    name: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && 'typecheck (push)' || 'typecheck' }}
    needs: [push-pr-gate]
    if: ${{ !cancelled() && (github.event_name != 'push' || github.ref == 'refs/heads/main' || needs.push-pr-gate.result != 'success' || needs.push-pr-gate.outputs.skip-duplicate-push != '1') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  test:
    name: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && 'test (push)' || 'test' }}
    needs: [push-pr-gate]
    if: ${{ !cancelled() && (github.event_name != 'push' || github.ref == 'refs/heads/main' || needs.push-pr-gate.result != 'success' || needs.push-pr-gate.outputs.skip-duplicate-push != '1') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Isolated PATH A fixture invariant tests (not physical qualification)
        run: node --test qualification/rel05g-patha/fixture.test.mjs

  build:
    name: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && 'build (push)' || 'build' }}
    needs: [push-pr-gate]
    if: ${{ !cancelled() && (github.event_name != 'push' || github.ref == 'refs/heads/main' || needs.push-pr-gate.result != 'success' || needs.push-pr-gate.outputs.skip-duplicate-push != '1') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend-recovery:
    name: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && 'backend-recovery (push)' || 'backend-recovery' }}
    needs: [push-pr-gate]
    if: ${{ !cancelled() && (github.event_name != 'push' || github.ref == 'refs/heads/main' || needs.push-pr-gate.result != 'success' || needs.push-pr-gate.outputs.skip-duplicate-push != '1') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: ci-placeholder-key
      ABSINTHE_RECOVERY_MODE: active
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest test_deployment_authority.py test_recovery_mode.py test_recipe_schema_readiness.py test_recipes_endpoint_characterization.py -q

  backend-rel05g1:
    name: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && 'backend-rel05g1 (push)' || 'backend-rel05g1' }}
    needs: [push-pr-gate]
    if: ${{ !cancelled() && (github.event_name != 'push' || github.ref == 'refs/heads/main' || needs.push-pr-gate.result != 'success' || needs.push-pr-gate.outputs.skip-duplicate-push != '1') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: ci-placeholder-key
      ABSINTHE_RECOVERY_MODE: active
      K323_POSTGRES_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest test_rel05g1_dormant_foundation.py test_rel05g4a_workout_contract.py test_rel05g4a_workout_api.py test_rel05g4a_workout_postgres.py test_rel05g4c_workout_postgres.py test_remote_mutation_v2.py test_remote_mutation_v2_api.py test_remote_mutation_api.py test_recovery_mode.py test_restore_validation.py test_health_weight_source.py test_remote_mutation_v2_postgres.py test_notes_identity_postgres.py test_notes_identity_guard_candidate.py test_notes_identity_guard_candidate_postgres.py test_notes_truncate_guard_postgres.py test_notes_identity_post_boundary.py -q
